<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Journey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #001a4d;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        .brand-logo {
            position: absolute;
            top: 30px;
            left: 30px;
            height: 85px;
            width: auto;
            object-fit: contain;
        }

        .wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            width: 100%;
            max-width: 450px;
        }

        .form-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            flex: 1;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .form-card h2 {
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: #001a4d;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Hides the application sub-journey dropdown container by default */
        #applicationSubGroup {
            display: none;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #002b80;
        }

        .required::after {
            content: " *";
            color: #dc2626;
            font-size: 1rem;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.2);
        }

        input::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        select:invalid {
            color: #94a3b8;
        }

        select option {
            color: #333333;
        }

        .horizontal-row-group {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }

        .field-pair {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .btn-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-top: 28px;
            position: sticky;
            bottom: 0;
            background: #ffffff;
            padding-top: 10px;
        }

        button {
            padding: 11px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .btn-submit {
            background-color: #ff8c00;
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: #e07b00;
        }

        .btn-reset {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
        }

        /* Feedback UI styles */
        #status {
            display: none;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        #consoleOutput {
            display: none;
            margin-top: 12px;
            padding: 10px;
            background-color: #1e293b;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.8rem;
            border-radius: 6px;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding-top: 120px;
            }

            .brand-logo {
                left: 50%;
                transform: translateX(-50%);
                top: 15px;
                height: 70px;
            }

            .wrapper {
                max-width: 100%;
            }

            .form-card {
                max-width: 100%;
                max-height: 75vh;
            }
        }

        @media (max-width: 480px) {
            .horizontal-row-group {
                flex-direction: column;
                gap: 20px;
            }

            .btn-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            button {
                width: 100%;
            }

            .form-card {
                padding: 20px;
                max-height: 70vh;
            }
        }
    </style>
</head>

<body>

    <img class="brand-logo" src="../HTML pages/knight-Logo.svg" alt="Knight Fintech Logo">

    <div class="wrapper">
        <div class="form-card">
            <h2>LOS Journey Selection</h2>

            <form id="appForm" onsubmit="handleSubmit(event)" data-automation-status="idle">
                <!-- Main Journey Dropdown -->
                <div class="form-group">
                    <label for="losjourneyseelction" class="required">Select Journey</label>
                    <select id="losjourneyseelction" name="losjourneyseelction" required onchange="toggleSubJourney()">
                        <option value="" disabled selected hidden>Select Option</option>
                        <option value="Debt Pool">Debt Pool</option>
                        <option value="Application Pool">Application Pool</option>
                    </select>
                </div>

                <!-- Conditional Sub-Dropdown for Application Upload Options -->
                <div class="form-group" id="applicationSubGroup">
                    <label for="applicationSubJourney" class="required">Select Application Type</label>
                    <select id="applicationSubJourney" name="applicationSubJourney">
                        <option value="" disabled selected hidden>Select Option</option>
                        <option value="ApplicationUpload">CLM 1</option>
                        <option value="ApplicationUploadCLM2">CLM 2</option>
                    </select>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset" onclick="handleReset()">Reset</button>
                </div>
            </form>

            <div id="status"></div>
            <pre id="consoleOutput"></pre>
        </div>
    </div>

    <script>
        function toggleSubJourney() {
            const mainDropdown = document.getElementById('losjourneyseelction');
            const subGroup = document.getElementById('applicationSubGroup');
            const subDropdown = document.getElementById('applicationSubJourney');

            if (mainDropdown.value === 'Application Pool') {
                subGroup.style.display = 'block';
                subDropdown.setAttribute('required', 'required');
            } else {
                subGroup.style.display = 'none';
                subDropdown.removeAttribute('required'); 
                subDropdown.value = ''; 
            }
        }
        function handleReset() {
            setTimeout(() => {
                toggleSubJourney();
            }, 10);
        }
       
        async function handleSubmit(event) {
            event.preventDefault();
            const form = document.getElementById('appForm');
            form.setAttribute('data-automation-status', 'submitted');
        }

        async function runPlaywrightTest() {
            const statusElement = document.getElementById('status');
            const consoleBox = document.getElementById('consoleOutput');
            const dropdown = document.getElementById('losjourneyseelction');
            const selectedJourney = dropdown.value;
        } 
    </script>
</body>

</html>
