<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data clean & Rebuild</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #001a4d;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        .brand-logo {
            position: absolute;
            top: 30px;
            left: 30px;
            height: 85px;
            width: auto;
            object-fit: contain;
        }

        .wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            width: 100%;
            max-width: 450px;
        }

        .form-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            flex: 1;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .form-card h2 {
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: #001a4d;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label.field-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #002b80;
        }

        .required::after {
            content: " *";
            color: #dc2626;
            font-size: 1rem;
        }

        input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.2);
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            background-color: #ffffff;
            width: 100%;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .file-upload-wrapper:hover {
            border-color: #94a3b8;
        }

        .hidden-file-input {
            display: none;
        }

        .custom-choose-btn {
            background-color: #f1f5f9;
            color: #333333;
            border-right: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            user-select: none;
            white-space: nowrap;
        }

        .file-upload-wrapper:hover .custom-choose-btn {
            background-color: #e2e8f0;
        }

        .file-name-display {
            padding: 10px 12px;
            font-size: 0.95rem;
            color: #94a3b8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
            pointer-events: none;
        }

        .horizontal-row-group {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }

        .field-pair {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .btn-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-top: 28px;
            position: sticky;
            bottom: 0;
            background: #ffffff;
            padding-top: 10px;
        }

        button.action-btn {
            padding: 11px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .btn-submit {
            background-color: #ff8c00;
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: #e07b00;
        }

        .btn-reset {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding-top: 120px;
            }

            .brand-logo {
                left: 50%;
                transform: translateX(-50%);
                top: 15px;
                height: 70px;
            }

            .wrapper {
                max-width: 100%;
            }

            .form-card {
                max-width: 100%;
                max-height: 75vh;
            }
        }

        @media (max-width: 480px) {
            .horizontal-row-group {
                flex-direction: column;
                gap: 20px;
            }

            .btn-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            button.action-btn {
                width: 100%;
            }

            .form-card {
                padding: 20px;
                max-height: 70vh;
            }
        }
    </style>
</head>

            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('appForm').setAttribute('data-automation-status', 'triggered');

                // Tracking IDs updated to include both explicit file input elements to trigger changes automatically
                const trackInputIds = ['collectionfileupload', 'datacleanup_Upload', 'backfill_Upload', 'partnerSelect', 'productSelect', 'rebuild', 'rebuildFromDate', 'rebuildToDate', 'appDate', /*'loanStatus', 'bankStatus'*/];
                trackInputIds.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {

                        });

            function triggerFileInput(id) {
                document.getElementById(id).click();
            }

            function updateFileName(inputElement, textDisplayId) {
                const displayEl = document.getElementById(textDisplayId);
                if (inputElement.files && inputElement.files.length > 0) {
                    displayEl.textContent = inputElement.files[0].name;
                    displayEl.style.color = "#333333";
                } else {
                    displayEl.textContent = "No file chosen";
                    displayEl.style.color = "#94a3b8";
                }
                validateRequiredFields();
            }

            function handleCollectionToggle(select) {
                const fileGroup = document.getElementById('collectionFileGroup');
                const fileInput = document.getElementById('collectionfileupload');
                const partnerProductGroup = document.getElementById('partnerProductGroup');
                const partnerSelect = document.getElementById('partnerSelect');
                const productSelect = document.getElementById('productSelect');

                if (select.value === 'true') {
                    select.style.color = '#333333';
                    if (fileGroup) fileGroup.style.display = 'block';
                    if (fileInput) fileInput.setAttribute('required', 'required');

                    if (partnerProductGroup) partnerProductGroup.style.display = 'block';
                    if (partnerSelect) partnerSelect.setAttribute('required', 'required');
                    if (productSelect) productSelect.setAttribute('required', 'required');
                } else {
                    select.style.color = select.value === 'false' ? '#333333' : '#94a3b8';
                    if (fileGroup) fileGroup.style.display = 'none';
                    if (fileInput) {
                        fileInput.removeAttribute('required');
                        fileInput.value = '';
                    }
                    const collectionText = document.getElementById('collection_text');
                    if (collectionText) {
                        collectionText.textContent = 'No file chosen';
                        collectionText.style.color = '#94a3b8';
                    }
                    if (partnerProductGroup) partnerProductGroup.style.display = 'none';
                    if (partnerSelect) partnerSelect.removeAttribute('required');
                    if (productSelect) productSelect.removeAttribute('required');
                    if (partnerSelect) {
                        partnerSelect.value = '';
                        partnerSelect.style.color = '#94a3b8';
                    }
                    if (productSelect) {
                        productSelect.innerHTML = '<option value="" disabled selected hidden>Select a product</option>';
                        productSelect.style.color = '#94a3b8';
                        productSelect.setAttribute('disabled', 'true');
                        productSelect.style.backgroundColor = '#f8fafc';
                        productSelect.style.cursor = 'not-allowed';
                        productSelect.style.opacity = '0.6';
                    }
                }
                validateRequiredFields();
            }

            function handlePartnerChange(partnerSelect) {
                partnerSelect.style.color = '#333333';
                const productSelect = document.getElementById('productSelect');
                if (!productSelect) return;

                productSelect.innerHTML = '<option value="" disabled selected hidden>Select a product</option>';
                productSelect.style.color = '#94a3b8';
                productSelect.removeAttribute('disabled');
                productSelect.style.backgroundColor = '#ffffff';
                productSelect.style.cursor = 'pointer';
                productSelect.style.opacity = '1';

                productOptionsArray.forEach(prod => {
                    const opt = document.createElement('option');
                    opt.value = prod.toLowerCase().replace(/\s+/g, '_');
                    opt.textContent = prod;
                    opt.style.color = '#333333';
                    productSelect.appendChild(opt);
                });

                validateRequiredFields();
            }

            function validateRequiredFields() {
                const backfillInput = document.getElementById("backfill_Upload");
                const datacleanupInput = document.getElementById("datacleanup_Upload");
                const collectionInput = document.getElementById("collectionfileupload");
                const partnerSelect = document.getElementById("partnerSelect");
                const productSelect = document.getElementById("productSelect");
                const rebuildSelect = document.getElementById("rebuild");
                const appDateInput = document.getElementById("appDate");
                const submitBtn = document.getElementById("submitBtn");

                if (!submitBtn) return;

                // Core required validation states evaluation matrix
                const hasDataCleanup = datacleanupInput && datacleanupInput.files && datacleanupInput.files.length > 0;
                const hasBackfill = backfillInput && backfillInput.files && backfillInput.files.length > 0;
                const hasCleanUpDate = appDateInput && appDateInput.value !== "";
                const hasRebuildOption = rebuildSelect && rebuildSelect.value !== "";

                let hasCollection = true;
                let hasPartner = true;
                let hasProduct = true;

                // Dynamic conditional validation evaluation trees
                if (rebuildSelect && rebuildSelect.value === 'true') {
                    hasCollection = collectionInput && collectionInput.files && collectionInput.files.length > 0;
                    hasPartner = partnerSelect && partnerSelect.value !== "";
                    hasProduct = productSelect && productSelect.value !== "";
                }

                // Comprehensive validation checks including dynamic and persistent form parameters
                if (hasDataCleanup && hasBackfill && hasCleanUpDate && hasRebuildOption && hasCollection && hasPartner && hasProduct) {
                    submitBtn.removeAttribute("disabled");
                    submitBtn.style.opacity = "1";
                    submitBtn.style.cursor = "pointer";
                } else {
                    submitBtn.setAttribute("disabled", "true");
                    submitBtn.style.opacity = "0.5";
                    submitBtn.style.cursor = "not-allowed";
                }
            }

            function handleReset() {
                document.getElementById('appForm').reset();

                const datacleanupText = document.getElementById('datacleanup_text');
                const backfillText = document.getElementById('backfill_text');
                const collectionText = document.getElementById('collection_text');

                if (datacleanupText) {
                    datacleanupText.textContent = "No file chosen";
                    datacleanupText.style.color = "#94a3b8";
                }
                if (backfillText) {
                    backfillText.textContent = "No file chosen";
                    backfillText.style.color = "#94a3b8";
                }
                if (collectionText) {
                    collectionText.textContent = "No file chosen";
                    collectionText.style.color = "#94a3b8";
                }

                const colorInputIds = [
                    'rebuildFromDate',
                    'rebuildToDate',
                    'appDate',
                    'rebuild',
                    'loanStatus',
                    'bankStatus',
                    'partnerSelect'
                ];

                colorInputIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.color = "#94a3b8";
                });

                const fileGroup = document.getElementById('collectionFileGroup');
                if (fileGroup) fileGroup.style.display = 'none';

                const partnerProductGroup = document.getElementById('partnerProductGroup');
                if (partnerProductGroup) partnerProductGroup.style.display = 'none';

                const partnerSelect = document.getElementById('partnerSelect');
                const productSelect = document.getElementById('productSelect');

                if (partnerSelect) partnerSelect.removeAttribute('required');

                // FIXED: Corrected structural innerHTML tag layout injection framework rule
                if (productSelect) {
                    productSelect.innerHTML = '<option value="" disabled selected hidden>Select a product</option>';
                    productSelect.style.color = '#94a3b8';
                    productSelect.setAttribute('disabled', 'true');
                    productSelect.removeAttribute('required');
                    productSelect.style.backgroundColor = '#f8fafc';
                    productSelect.style.cursor = 'not-allowed';
                    productSelect.style.opacity = '0.6';
                }

                // FIXED: Relocated step inside reset boundary loop execution space
                validateRequiredFields();
            }
            
            function handleFormSubmit(event) {
                event.preventDefault();
                document.getElementById('appForm').setAttribute('data-automation-status', 'submitted');
                setTimeout(() => {
                    alert('Data clean-up workflow process submitted successfully!');
                }, 100);
            }

        </script>
