<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Journey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #001a4d;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        .brand-logo {
            position: absolute;
            top: 30px;
            left: 30px;
            height: 85px;
            width: auto;
            object-fit: contain;
        }

        .wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            width: 100%;
            max-width: 450px;
        }

        .form-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            flex: 1;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .form-card h2 {
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: #001a4d;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        #applicationSubGroup {
            display: none;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #002b80;
        }

        .required::after {
            content: " *";
            color: #dc2626;
            font-size: 1rem;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.2);
        }

        input::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        select:invalid {
            color: #94a3b8;
        }

        select option {
            color: #333333;
        }

        .horizontal-row-group {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }

        .field-pair {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .btn-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-top: 28px;
            position: sticky;
            bottom: 0;
            background: #ffffff;
            padding-top: 10px;
        }

        button {
            padding: 11px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .btn-submit {
            background-color: #ff8c00;
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: #e07b00;
        }

        .btn-reset {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
        }

        .btn-test {
            grid-column: span 2;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            margin-top: 5px;
        }

        .btn-test:hover {
            background-color: #334155;
        }

        #status {
            display: none;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .status-success {
            background-color: #dcfce7;
            color: #166534;
        }

        #consoleOutput {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background-color: #0f172a;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.8rem;
            border-radius: 6px;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding-top: 120px;
            }

            .brand-logo {
                left: 50%;
                transform: translateX(-50%);
                top: 15px;
                height: 70px;
            }

            .wrapper {
                max-width: 100%;
            }

            .form-card {
                max-width: 100%;
                max-height: 75vh;
            }
        }

        @media (max-width: 480px) {
            .horizontal-row-group {
                flex-direction: column;
                gap: 20px;
            }

            .btn-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .btn-test {
                grid-column: span 1;
            }

            button {
                width: 100%;
            }

            .form-card {
                padding: 20px;
                max-height: 70vh;
            }
        }
    </style>
</head>

<body>
    <img class="brand-logo" src="../HTML pages/knight-Logo.svg" alt="Knight Fintech Logo">

    <div class="wrapper">
        <div class="form-card">
          <h2 style="text-align: center; color: #001a4d; margin-bottom: 24px; font-size: 1.5rem; border-bottom: 2px solid #eaeaea; padding-bottom: 10px;">LMS Journey</h2>
            <form id="appForm" onsubmit="handleSubmit(event)" data-automation-status="idle">
                <div class="form-group">
                    <label for="losjourneyseelction" class="required">Select LMS Journey</label>
                    <select id="losjourneyseelction" name="losjourneyseelction" required onchange="toggleSubJourney()">
                        <option value="" disabled selected hidden>Select journey...</option>
                        <option value="Anniversary">Anniversary</option>
                        <option value="Gold Loan">Gold Loan</option>
                        <option value="M+1">M+1</option>
                        <option value="Unique">Unique</option>
                        <option value="BC">BC</option>
                        <option value="Application Pool">Application Pool</option>
                        <option value="Lending">Lending</option>
                    </select>
                </div>

                <div class="form-group" id="applicationSubGroup" style="display: none;">
                    <label for="applicationSubJourney" class="required">Select Sub Journey</label>
                    <select id="applicationSubJourney" name="applicationSubJourney">
                        <option value="" disabled selected hidden>Select sub journey...</option>
                        <option value="Sub-Pool-1">Sub Pool 1</option>
                        <option value="Sub-Pool-2">Sub Pool 2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="required" style="display: block; margin-bottom: 8px; white-space: nowrap;">Select
                        Input Method</label>
                    <div style="display: flex; flex-direction: row; align-items: center; gap: 24px;">
                        <label
                            style="font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                            <input type="radio" id="selectAppId" name="inputMethod" value="appId"
                                onchange="toggleInputFields()" style="margin: 0; cursor: pointer;">Application ID
                        </label>
                        <label
                            style="font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                            <input type="radio" id="selectFileUpload" name="inputMethod" value="fileUpload"
                                onchange="toggleInputFields()" style="margin: 0; cursor: pointer;">File Upload
                        </label>
                    </div>
                </div>

                <div class="horizontal-row-group">
                    <div class="field-pair" id="appIdContainer" style="display: none;">
                        <label for="applicationId" class="required">Application ID</label>
                        <input type="text" id="applicationId" name="applicationId" placeholder="Enter Application ID">
                    </div>

                    <div class="field-pair" id="fileUploadContainer" style="display: none;">
                        <label for="fileUpload" class="required">Upload File</label>
                        <input type="file" id="fileUpload" name="fileUpload">
                    </div>
                </div>

                <div class="form-group" id="modifiersConfigContainer" style="margin-top: 16px;">
                    <label for="userInputModifiers">Payment Schedule Type</label>

                    <input type="text" id="userInputModifiers" placeholder="e.g., pp fc 1.0 1.5 0.0"
                        oninput="formatModifiersToArray(this)"
                        style="width: 100%; font-family: monospace; margin-bottom: 8px;">

                    <input type="hidden" id="hiddenCustomModifiers" name="customModifiers" value="[]">

                    <div class="modifier-notes"
                        style="margin-top: 10px; background-color: #f1f5f9; border-left: 4px solid #002b80; padding: 12px; font-size: 0.8rem; line-height: 1.6; color: #475569; border-radius: 0 6px 6px 0;">
                        <strong style="display: block; margin-bottom: 6px; color: #002b80; font-size: 0.85rem;">Payment
                            Type Reference:</strong>
                        <ul
                            style="margin: 0; padding: 0; list-style-type: disc; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 16px; padding-left: 16px;">
                            <li><strong>FP</strong> = Full Payment</li>
                            <li><strong>PP</strong> = Part Payment</li>
                            <li><strong>FC</strong> = Foreclosure</li>
                            <li><strong>&gt; 1.0</strong> = Advanced Payment</li>
                            <li><strong>&lt; 1.0</strong> = Partial Payment</li>
                            <li><strong>0.0</strong> = No Payment</li>
                        </ul>
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset" onclick="handleReset()">Reset</button>
                </div>
            </form>
            <div id="status"></div>
            <pre id="consoleOutput"></pre>
        </div>
    </div>

    <script>
        function formatModifiersToArray(inputElement) {
            const rawValue = inputElement.value;
            const tokens = rawValue.split(/[\s,]+/);

            const formattedArray = tokens.map(token => {
                let clean = token.trim();
                if (!clean) return null;

                return clean.toUpperCase();
            }).filter(item => item !== null);

            const formattedStringArray = "[" + formattedArray.map(item => `'${item}'`).join(',') + "]";
            document.getElementById('hiddenCustomModifiers').value = formattedStringArray;
        }

        function toggleInputFields() {
            const selectAppId = document.getElementById('selectAppId');
            const selectFileUpload = document.getElementById('selectFileUpload');
            if (!selectAppId || !selectFileUpload) return;

            const appIdContainer = document.getElementById('appIdContainer');
            const fileUploadContainer = document.getElementById('fileUploadContainer');
            const appIdInput = document.getElementById('applicationId');
            const fileInput = document.getElementById('fileUpload');

            if (selectAppId.checked) {
                if (appIdContainer) appIdContainer.style.display = 'block';
                if (fileUploadContainer) fileUploadContainer.style.display = 'none';
                if (appIdInput) appIdInput.required = true;
                if (fileInput) fileInput.required = false;
            } else if (selectFileUpload.checked) {
                if (appIdContainer) appIdContainer.style.display = 'none';
                if (fileUploadContainer) fileUploadContainer.style.display = 'block';
                if (appIdInput) appIdInput.required = false;
                if (fileInput) fileInput.required = true;
            } else {
                if (appIdContainer) appIdContainer.style.display = 'none';
                if (fileUploadContainer) fileUploadContainer.style.display = 'none';
                if (appIdInput) appIdInput.required = false;
                if (fileInput) fileInput.required = false;
            }
        }

        function toggleSubJourney() {
            const mainDropdown = document.getElementById('losjourneyseelction');
            const subGroup = document.getElementById('applicationSubGroup');
            const subDropdown = document.getElementById('applicationSubJourney');

            if (mainDropdown.value === 'Application Pool') {
                if (subGroup) subGroup.style.display = 'block';
                if (subDropdown) subDropdown.setAttribute('required', 'required');
            } else {
                if (subGroup) subGroup.style.display = 'none';
                if (subDropdown) {
                    subDropdown.removeAttribute('required');
                    subDropdown.value = '';
                }
            }
        }

        function handleReset() {
            setTimeout(() => {
                toggleInputFields();
                toggleSubJourney();
                document.getElementById('appForm').setAttribute('data-automation-status', 'idle');

                const status = document.getElementById('status');
                const consoleOutput = document.getElementById('consoleOutput');
                if (status) status.style.display = 'none';
                if (consoleOutput) consoleOutput.style.display = 'none';

                const displayInput = document.getElementById('userInputModifiers');
                if (displayInput) displayInput.value = '';
                document.getElementById('hiddenCustomModifiers').value = '[]';
            }, 10);
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const selectAppId = document.getElementById('selectAppId');
            const selectFileUpload = document.getElementById('selectFileUpload');

            if (!selectAppId.checked && !selectFileUpload.checked) {
                alert("Please select an input method (Application ID or File Upload) before submitting.");
                return false;
            }

            const form = document.getElementById('appForm');
            form.setAttribute('data-automation-status', 'triggered');

            const formData = new FormData(form);
            const submissionData = Object.fromEntries(formData);

            if (submissionData.inputMethod === 'fileUpload' && submissionData.fileUpload) {
                submissionData.fileUpload = submissionData.fileUpload.name;
            }

            const capturedAppId = submissionData.applicationId || 'DEFAULT_APP_ID';

            const rawStringArray = document.getElementById('hiddenCustomModifiers').value;

            submissionData.appModifiersMap = {
                [capturedAppId]: rawStringArray
            };

            submissionData.customModifiers = rawStringArray;

            const consoleOutput = document.getElementById('consoleOutput');
            if (consoleOutput) {
                consoleOutput.textContent = "Data Frame Output:\n" + JSON.stringify(submissionData, null, 2);
                consoleOutput.style.display = "block";
            }
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.className = "status-success";
                statusElement.innerText = "Form state captured and validated successfully!";
                statusElement.style.display = "block";
            }
            return false;
        }


    </script>

</body>

</html>
